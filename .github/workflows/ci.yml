name: .NET CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-package:
    name: Build, Test, and Verify
    runs-on: ubuntu-latest

    steps:
      - name: 🛒 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # Automatically reads exactly "10.0.201" from your global.json!
          global-json-file: global.json

      - name: 🔧 Restore Local Tools
        # Required to install dotnet-reportgenerator-globaltool as defined in dotnet-tools.json
        run: dotnet tool restore

      - name: 🧪 Run Build, Tests, and Coverage
        shell: bash
        run: |
          # 1. Quick debug check: list files so you can verify they are in the root
          echo "Current directory contents:"
          ls -la
          # 2. Use bash to natively handle the wildcard and make scripts executable
          chmod +x *.ps1 || echo "Warning: No .ps1 files found to chmod."
          # 3. Explicitly execute the script using the PowerShell Core engine
          pwsh ./test.ps1

      - name: 📊 Upload Coverage Report
        # Uploads the HTML dashboard your script generated so you can view it in the GitHub UI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: artifacts/report/
          retention-days: 14

      - name: 🐳 Validate Docker Build
        # Ensures your Dockerfile is healthy and builds successfully
        run: docker buildx build -t mutual-fund-api:ci-test .
